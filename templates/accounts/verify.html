{% extends 'base.html' %}
{% load static %}
{% block title %}Введите код — cloud.nimbus{% endblock %}
{% block content %}
<section class="auth-card compact-card">
  <a class="auth-brand" href="{% url 'accounts:login' %}"><img src="{% static 'img/cloud-nimbus-logo.png' %}" alt=""><span>cloud.nimbus</span></a>
  <div class="auth-copy"><h1 data-i18n="confirm_email">Проверьте почту</h1><p>Код отправлен на <strong>{{ email }}</strong>. Он действует 10 минут.</p></div>
  <form method="post" class="stack-form otp-form">
    {% include 'accounts/_form.html' %}
    <button class="primary-button" type="submit" data-i18n="sign_in">Подтвердить</button>
  </form>
  <form method="post" action="{% if purpose == 'verify' %}{% url 'accounts:resend_email' %}{% else %}{% url 'accounts:resend_login' %}{% endif %}" class="center-form">{% csrf_token %}<button class="link-button" type="submit" data-i18n="resend_code">Отправить код ещё раз</button></form>
</section>
{% endblock %}
