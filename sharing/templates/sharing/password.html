{% extends 'base.html' %}
{% block title %}Защищённый доступ — cloud.nimbus{% endblock %}
{% block content %}
<section class="auth-card compact-card">
  <div class="auth-copy"><span class="eyebrow">Защищённая ссылка</span><h1>{{ share.target_name }}</h1><p>Введите пароль, который сообщил владелец.</p></div>
  <form class="stack-form" method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
    <label class="field"><span>{{ form.password.label }}</span>{{ form.password }}{% if form.password.errors %}<em>{{ form.password.errors|striptags }}</em>{% endif %}</label>
    <button class="primary-button full" type="submit">Открыть</button>
  </form>
</section>
{% endblock %}
