[project]
name = "cloud-nimbus"
version = "0.1.0"
description = "A compact, self-hosted cloud drive built with Django"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "levinmikhail" }]
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "webauthn==3.0.0",
    "pyotp==2.10.0",
]

[project.optional-dependencies]
dev = ["coverage>=7.8,<8"]
production = ["psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
include = ["config*", "accounts*", "drive*", "core*", "sharing*", "vaults*", "opaque_auth*", "passkeys*", "otp_auth*"]

[tool.setuptools.package-data]
opaque_auth = ["bridge.mjs"]
