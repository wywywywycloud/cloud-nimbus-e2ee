name: Backend and browser verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: cloud-cypher
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: cloud-cypher
      - run: python scripts/run_checks.py --report-dir ci-reports
      - run: python scripts/test_e2ee.py --report-dir ci-reports
        env:
          OPAQUE_NODE: node
          PLAYWRIGHT_MODULE: '${{ github.workspace }}/cloud-cypher/node_modules/playwright'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-results
          path: ci-reports/
