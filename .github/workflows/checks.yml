name: Verify and deploy Nimbus
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r deploy/requirements.txt
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: cloud-cypher
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: cloud-cypher
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python ci/test_nginx.py
      - run: python ci/test_release.py
      - run: python ci/check_deployment.py
      - run: python scripts/run_checks.py --report-dir ci-reports
      - run: python scripts/test_e2ee.py --report-dir ci-reports
        env:
          OPAQUE_NODE: node
          PLAYWRIGHT_MODULE: '${{ github.workspace }}/cloud-cypher/node_modules/playwright'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-results
          path: ci-reports/*.json
          retention-days: 7
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nimbus_ci
          POSTGRES_USER: nimbus_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nimbus_ci -d nimbus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: nimbus_ci
      POSTGRES_USER: nimbus_ci
      POSTGRES_PASSWORD: disposable-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      OPAQUE_NODE: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r deploy/requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - run: python manage.py test ci.test_postgresql --verbosity 2
  deploy:
    needs: [verify, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NIMBUS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: nimbus-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit with restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.NIMBUS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NIMBUS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 nimbus-deploy@13.143.141.139 "$RELEASE_SHA"
